[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-react"
version = "0.1.0"
description = "SDM-REACT: Al-Si-Ti-Fe-Cu 五元系の焼結拡散マルチプル法に向けた反応経路・観測可能性・実験選択の統合設計基盤 (基本設計書 v1.0 の初期実装)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
